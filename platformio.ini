; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
platform = espressif32
upload_protocol = esp-builtin
debug_tool = esp-builtin
board = esp32-c3-devkitm-1
platform_packages = 
    espressif/toolchain-riscv32-esp@12.2.0+20230208
build_unflags =
   -std=gnu++17
build_flags =
   -DARDUINO_USB_MODE=1 ;serial mode config
   -DARDUINO_USB_CDC_ON_BOOT=1 ; serial mode config
   -std=gnu++23
   -Wno-attributes
   -D_GNU_SOURCE
   -march=rv32imc_zicsr_zifencei
   -Wa,-march=rv32imc_zicsr_zifencei
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_deps = 
    Adafruit SSD1306@^2.5.17 
    Adafruit GFX Library@^1.12.6
    Adafruit Unified Sensor@^1.1.15
    Adafruit MPU6050@^2.2.9 ; might not be needed now
